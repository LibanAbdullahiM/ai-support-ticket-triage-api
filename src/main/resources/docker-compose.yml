services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ai_support_ticket_triage
      POSTGRES_PASSWORD: ticket@26
      POSTGRES_DB: ai_support_ticket_triage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgreesql/data

volumes:
  postgres_data: